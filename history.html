<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co; font-src 'self' https://cdn.jsdelivr.net;">
    <title>History - Daily Cash Register</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/history.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" media="all">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="dashboard.html" class="brand">
                <i class="ri-file-list-3-line"></i>
                <h2>History</h2>
            </a>
            <div class="nav-links">
                <a href="dashboard.html" title="Home" aria-label="Home"><i class="ri-home-4-line" aria-hidden="true"></i></a>
                <a href="box.html" title="Secret Box" aria-label="Secret Box"><i class="ri-archive-drawer-line" aria-hidden="true"></i></a>
                <a href="history.html" class="active" title="History" aria-label="History"><i class="ri-file-list-3-line" aria-hidden="true"></i></a>
                <a href="profile.html" title="Profile" aria-label="Profile"><i class="ri-user-3-line" aria-hidden="true"></i></a>
            </div>
        </div>

        <div class="filter-wrapper">
            <div class="date-range">
                <input type="date" id="startDate" onchange="fetchHistory()">
                <span class="to-text">to</span>
                <input type="date" id="endDate" onchange="fetchHistory()">
            </div>
            
            <div class="search-filters">
                <select id="typeFilter" onchange="applyFilters()">
                    <option value="ALL">All Types</option>
                    <option value="IN">🟢 Received</option>
                    <option value="OUT">🔴 Paid</option>
                </select>

                <div class="custom-select-wrapper">
                    <div class="select-box" onclick="toggleDropdown()">
                        <span id="selectedText">Select Names...</span>
                        <i class="ri-arrow-down-s-line"></i>
                    </div>
                    <div class="dropdown-list" id="nameDropdown"></div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <div class="mini-summary">
                <span>Found: <b id="countRow">0</b></span>
                <span>Total: <b id="totalAmount">₹0.00</b></span>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn-icon btn-pdf" onclick="downloadPDF()" title="Download PDF" aria-label="Download PDF"><i class="ri-file-pdf-line" aria-hidden="true"></i></button>
                <button class="btn-icon btn-share" onclick="shareHistory()" title="Share List" aria-label="Share via WhatsApp"><i class="ri-whatsapp-line" aria-hidden="true"></i></button>
                <button id="bulkDeleteBtn" class="btn-bulk-delete hidden" onclick="deleteSelected()" aria-label="Delete selected items"><i class="ri-delete-bin-2-line" aria-hidden="true"></i> (<span id="selCount">0</span>)</button>
            </div>
        </div>

        <div class="table-container">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" id="selectAll" onclick="toggleSelectAll()">
                        </th>
                        <th>Date</th>
                        <th>Name / Description</th>
                        <th>Type</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="noData" class="no-data">No records found matching your filters.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/share-image.js" defer></script>
    <script src="js/history.js" defer></script>
    <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
