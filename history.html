<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/history.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div class="brand">
                <a href="dashboard.html" class="back-btn"><i class="ri-arrow-left-line"></i></a>
                <h2>Records</h2>
            </div>
        </div>

        <div class="filter-area">
            <input type="month" id="monthPicker" onchange="loadHistory()">
        </div>

        <div id="historyList" class="history-container">
            <div class="loading">Loading records...</div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modalDate">Details</h3>
            <div class="modal-body">
                <div id="modalInList"></div>
                <div id="modalOutList"></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
