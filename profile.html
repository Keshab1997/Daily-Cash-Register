<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2331/2331966.png">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/profile.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div class="brand">
                <a href="dashboard.html" class="back-btn"><i class="ri-arrow-left-line"></i></a>
                <h2>Profile</h2>
            </div>
            <div style="display:flex; gap:15px;">
                <a href="box.html" style="font-size:1.4rem; color:#6b7280;"><i class="ri-archive-drawer-line"></i></a>
            </div>
        </div>

        <div class="profile-card">
            <div class="avatar">
                <i class="ri-user-smile-line"></i>
            </div>
            <h3 id="userEmail" class="user-email">Loading...</h3>
            <p class="user-role">Manager</p>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <span id="totalDays">0</span>
                    <small>Days Active</small>
                </div>
                <div class="stat-box">
                    <span id="lastBalance">0</span>
                    <small>Current Cash</small>
                </div>
            </div>

            <button class="btn-logout" onclick="logout()">
                <i class="ri-logout-box-r-line"></i> Logout
            </button>
        </div>

        <!-- Danger Zone for Data Reset -->
        <div class="danger-zone">
            <h4>⚠️ Danger Zone</h4>
            <p>Once you delete your data, there is no going back. Please be certain.</p>
            <button class="btn-reset" onclick="resetAccount()">
                <i class="ri-delete-bin-7-line"></i> Delete All Data (Factory Reset)
            </button>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
