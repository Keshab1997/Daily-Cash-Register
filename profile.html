<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' https: data: blob:; connect-src 'self' https://*.supabase.co; font-src 'self' https://cdn.jsdelivr.net;">
    <title>Profile - Hisab Manager</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/profile.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" media="all">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="dashboard.html" class="brand">
                <i class="ri-user-3-line"></i>
                <h2>My Profile</h2>
            </a>
            <div class="nav-links">
                <a href="dashboard.html" title="Home" aria-label="Home"><i class="ri-home-4-line" aria-hidden="true"></i></a>
                <a href="box.html" title="Secret Box" aria-label="Secret Box"><i class="ri-archive-drawer-line" aria-hidden="true"></i></a>
                <a href="history.html" title="History" aria-label="History"><i class="ri-file-list-3-line" aria-hidden="true"></i></a>
                <a href="profile.html" class="active" title="Profile" aria-label="Profile"><i class="ri-user-3-line" aria-hidden="true"></i></a>
            </div>
        </div>

        <div class="profile-wrapper">
            <!-- Profile Header Card -->
            <div class="profile-header">
                <div class="profile-cover"></div>
                <div class="profile-info">
                    <!-- প্রোফাইল পিকচার সেকশন -->
                    <div class="avatar-container">
                        <div class="avatar-wrapper" onclick="document.getElementById('avatarInput').click()" role="button" tabindex="0" aria-label="Upload profile picture">
                            <img id="profileImg" src="https://via.placeholder.com/150?text=User" alt="User profile picture" loading="lazy">
                            <div class="upload-overlay">
                                <i class="ri-camera-switch-line" aria-hidden="true"></i>
                            </div>
                        </div>
                        <input type="file" id="avatarInput" hidden accept="image/*" onchange="uploadAvatar(this)" aria-label="Choose profile picture">
                    </div>
                    
                    <h2 id="userEmail">Loading...</h2>
                    <span class="badge-manager">Account Manager</span>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-icon icon-blue">
                        <i class="ri-calendar-check-line"></i>
                    </div>
                    <div class="stat-texts">
                        <h3 id="totalDays">0</h3>
                        <p>Days Active</p>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon icon-green">
                        <i class="ri-wallet-3-line"></i>
                    </div>
                    <div class="stat-texts">
                        <h3 id="lastBalance">₹0</h3>
                        <p>Current Cash</p>
                    </div>
                </div>
            </div>

            <!-- Settings/Actions -->
            <div class="profile-actions">
                <button class="btn-action btn-logout" onclick="logout()" aria-label="Logout from account">
                    <i class="ri-logout-box-r-line" aria-hidden="true"></i>
                    <span>Logout from Account</span>
                </button>
            </div>

            <!-- Danger Zone -->
            <div class="danger-card">
                <div class="danger-header">
                    <i class="ri-error-warning-line" aria-hidden="true"></i>
                    <h4>Danger Zone</h4>
                </div>
                <p>Deleting your account will permanently erase all transactions and daily reports. This action cannot be undone.</p>
                <button class="btn-reset-new" onclick="resetAccount()" aria-label="Factory reset and delete all data">
                    <i class="ri-delete-bin-7-line" aria-hidden="true"></i> Factory Reset (Delete All Data)
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/profile.js" defer></script>
</body>
</html>
