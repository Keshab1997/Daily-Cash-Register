<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Hisab Manager</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2331/2331966.png">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/profile.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Standard Navbar -->
        <div class="navbar">
            <a href="dashboard.html" class="brand">
                <i class="ri-user-3-line"></i>
                <h2>My Profile</h2>
            </a>
            <div class="nav-links">
                <a href="dashboard.html" title="Home"><i class="ri-home-4-line"></i></a>
                <a href="box.html" title="Secret Box"><i class="ri-archive-drawer-line"></i></a>
                <a href="history.html" title="History"><i class="ri-file-list-3-line"></i></a>
                <a href="profile.html" class="active" title="Profile"><i class="ri-user-3-line"></i></a>
            </div>
        </div>

        <div class="profile-wrapper">
            <!-- Profile Header Card -->
            <div class="profile-header">
                <div class="profile-cover"></div>
                <div class="profile-info">
                    <!-- প্রোফাইল পিকচার সেকশন -->
                    <div class="avatar-container">
                        <div class="avatar-wrapper" onclick="document.getElementById('avatarInput').click()">
                            <img id="profileImg" src="https://via.placeholder.com/150?text=User" alt="Profile">
                            <div class="upload-overlay">
                                <i class="ri-camera-switch-line"></i>
                            </div>
                        </div>
                        <input type="file" id="avatarInput" hidden accept="image/*" onchange="uploadAvatar(this)">
                    </div>
                    
                    <h2 id="userEmail">Loading...</h2>
                    <span class="badge-manager">Account Manager</span>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats-container">
                <div class="stat-item">
                    <div class="stat-icon icon-blue">
                        <i class="ri-calendar-check-line"></i>
                    </div>
                    <div class="stat-texts">
                        <h3 id="totalDays">0</h3>
                        <p>Days Active</p>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon icon-green">
                        <i class="ri-wallet-3-line"></i>
                    </div>
                    <div class="stat-texts">
                        <h3 id="lastBalance">₹0</h3>
                        <p>Current Cash</p>
                    </div>
                </div>
            </div>

            <!-- Settings/Actions -->
            <div class="profile-actions">
                <button class="btn-action btn-logout" onclick="logout()">
                    <i class="ri-logout-box-r-line"></i>
                    <span>Logout from Account</span>
                </button>
            </div>

            <!-- Danger Zone -->
            <div class="danger-card">
                <div class="danger-header">
                    <i class="ri-error-warning-line"></i>
                    <h4>Danger Zone</h4>
                </div>
                <p>Deleting your account will permanently erase all transactions and daily reports. This action cannot be undone.</p>
                <button class="btn-reset-new" onclick="resetAccount()">
                    <i class="ri-delete-bin-7-line"></i> Factory Reset (Delete All Data)
                </button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
