<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Box - Hisab</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/box.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
<div class="container">
<div class="navbar">
<a href="dashboard.html" class="brand">
<i class="ri-archive-drawer-line"></i>
<h2>Secret Box</h2>
</a>
<div class="nav-links">
<a href="dashboard.html" title="Home"><i class="ri-home-4-line"></i></a>
<a href="box.html" class="active" title="Secret Box"><i class="ri-archive-drawer-line"></i></a>
<a href="history.html" title="History"><i class="ri-file-list-3-line"></i></a>
<a href="profile.html" title="Profile"><i class="ri-user-3-line"></i></a>
</div>
</div>

<div class="stats-grid">
        <div class="stat-card system-card">
            <small>System Balance (Official)</small>
            <span id="sysBal">₹0.00</span>
            <i class="ri-computer-line icon-bg"></i>
        </div>
        <div class="stat-card due-card">
            <small>Personal Due (Short)</small>
            <span id="dueBal">₹0.00</span>
            <i class="ri-user-shared-line icon-bg"></i>
        </div>
        <div class="stat-card physical-card">
            <small>Physical Cash (Actual)</small>
            <span id="phyBal">₹0.00</span>
            <i class="ri-money-dollar-circle-line icon-bg"></i>
        </div>
    </div>

    <div style="text-align: right; margin-bottom: 15px;">
        <button onclick="showDueSummary()" style="background: #4f46e5; color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;">
            <i class="ri-file-list-2-line"></i> View Due Summary
        </button>
    </div>

    <div class="input-section">
        <h3>New Secret Entry</h3>
        <div class="input-grid-4">
            <div class="inp-grp">
                <label>Date</label>
                <input type="date" id="sDate">
            </div>
            <div class="inp-grp">
                <label>Purpose</label>
                <input type="text" id="sPurpose" placeholder="Purpose (e.g. Loan)" list="purposeSuggestions" oninput="handleAutoFill()">
            </div>
            <div class="inp-grp">
                <label>Name</label>
                <input type="text" id="sName" placeholder="Person Name">
            </div>
            <div class="inp-grp">
                <label>Amount</label>
                <input type="number" id="sAmount" placeholder="₹ Amount">
            </div>
        </div>
        
        <div class="btn-row">
            <button class="btn-take" onclick="addSecretTransaction('TAKE')">
                <i class="ri-hand-coin-line"></i> Take (Loan)
            </button>
            <button class="btn-return" onclick="addSecretTransaction('RETURN')">
                <i class="ri-arrow-go-back-line"></i> Return (Deposit)
            </button>
        </div>
    </div>

    <datalist id="purposeSuggestions"></datalist>

    <div class="history-section">
        <div class="history-header">
            <h3>Recent Activity</h3>
            <a href="secret_history.html" class="btn-view-all">
                View Full History & Edit <i class="ri-arrow-right-line"></i>
            </a>
        </div>
        <ul id="secretList" class="secret-list"></ul>
        <div id="noSecretData" class="no-data-msg" style="display:none;">No recent activity.</div>
    </div>
</div>

<!-- Modal for Due Summary -->
<div id="dueModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="ri-user-star-line"></i> Due List (Person-wise)</h3>
            <button onclick="closeDueModal()" class="close-btn"><i class="ri-close-line"></i></button>
        </div>
        <div class="modal-body">
            <table class="due-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th style="text-align: right;">Net Balance</th>
                    </tr>
                </thead>
                <tbody id="dueListBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/box.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
