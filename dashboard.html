<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hisab</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="dashboard.html" class="brand">
                <i class="ri-wallet-3-line"></i>
                <h2>Hisab Manager</h2>
            </a>
            <div class="nav-links">
                <button class="btn-icon-nav" onclick="toggleCashCounter()" title="Cash Counter">
                    <i class="ri-calculator-line"></i>
                </button>
                <a href="dashboard.html" class="active" title="Home"><i class="ri-home-4-line"></i></a>
                <a href="box.html" title="Secret Box"><i class="ri-archive-drawer-line"></i></a>
                <a href="history.html" title="History"><i class="ri-file-list-3-line"></i></a>
                <a href="profile.html" title="Profile"><i class="ri-user-3-line"></i></a>
            </div>
        </div>

        <!-- Cash Denomination Counter -->
        <div id="cashCounter" class="cash-counter-box" style="display: none;">
            <div class="counter-header">
                <span><i class="ri-coins-line"></i> Physical Cash Counter</span>
                <button onclick="toggleCashCounter()" class="close-mini"><i class="ri-close-line"></i></button>
            </div>
            
            <!-- Secret Adjustment Info -->
            <div class="adjustment-info">
                <small>Official Bal: <span id="offBal">₹0</span></small>
                <small>Secret Due: <span id="secDue" style="color:#ef4444">₹0</span></small>
                <div class="target-cash">Expected Cash: <b id="targetCash">₹0</b></div>
            </div>

            <div class="counter-grid">
                <!-- High Denominations -->
                <div class="denom-row high-val"><span>50k</span> <input type="number" class="denom-input" data-val="50000" oninput="calcDenom()"></div>
                <div class="denom-row high-val"><span>20k</span> <input type="number" class="denom-input" data-val="20000" oninput="calcDenom()"></div>
                <div class="denom-row high-val"><span>10k</span> <input type="number" class="denom-input" data-val="10000" oninput="calcDenom()"></div>
                
                <!-- Standard Denominations -->
                <div class="denom-row"><span>500</span> <input type="number" class="denom-input" data-val="500" oninput="calcDenom()"></div>
                <div class="denom-row"><span>200</span> <input type="number" class="denom-input" data-val="200" oninput="calcDenom()"></div>
                <div class="denom-row"><span>100</span> <input type="number" class="denom-input" data-val="100" oninput="calcDenom()"></div>
                <div class="denom-row"><span>50</span> <input type="number" class="denom-input" data-val="50" oninput="calcDenom()"></div>
                <div class="denom-row"><span>20</span> <input type="number" class="denom-input" data-val="20" oninput="calcDenom()"></div>
                <div class="denom-row"><span>10</span> <input type="number" class="denom-input" data-val="10" oninput="calcDenom()"></div>
                <div class="denom-row"><span>Coins</span> <input type="number" class="denom-input" data-val="1" oninput="calcDenom()"></div>
            </div>
            <div class="counter-footer">
                <div>Total Counted: <b id="totalCounted">₹0</b></div>
                <div id="diffStatus" class="diff-status">Difference: ₹0</div>
            </div>
        </div>

        <div class="top-controls">
            <div class="date-group">
                <label class="label-text">Date (IST)</label>
                <input type="date" id="date">
            </div>
            <div class="opening-group">
                <label class="label-text">Opening Balance</label>
                <input type="number" id="opening" value="0" oninput="updateSummary()">
            </div>
        </div>

        <div class="entry-grid">
            <div class="card card-in">
                <div class="card-header">
                    <span class="text-green">Cash Received (IN) <small class="shortcut-text">[Alt + I]</small></span>
                    <i class="ri-arrow-down-circle-line text-green"></i>
                </div>
                <div class="input-group">
                    <input type="text" id="inName" placeholder="Payer Name" list="nameSuggestions">
                    <input type="number" id="inAmount" placeholder="Amount">
                    <button class="btn-add-in" onclick="addTransaction('IN')"><i class="ri-add-line"></i></button>
                </div>
                <ul id="listIn" class="trans-list"></ul>
            </div>

            <div class="card card-out">
                <div class="card-header">
                    <span class="text-red">Cash Payment (OUT) <small class="shortcut-text">[Alt + O]</small></span>
                    <i class="ri-arrow-up-circle-line text-red"></i>
                </div>
                <div class="input-group">
                    <input type="text" id="outName" placeholder="Receiver / Expense" list="nameSuggestions">
                    <input type="number" id="outAmount" placeholder="Amount">
                    <button class="btn-add-out" onclick="addTransaction('OUT')"><i class="ri-add-line"></i></button>
                </div>
                <ul id="listOut" class="trans-list"></ul>
            </div>
        </div>

        <datalist id="nameSuggestions"></datalist>

        <div class="summary-box">
            <div class="sum-item">
                <small>Total Received</small>
                <span id="sumIn" class="text-green">₹0.00</span>
            </div>
            <div class="sum-item">
                <small>Total Paid</small>
                <span id="sumOut" class="text-red">₹0.00</span>
            </div>
            <div class="sum-item">
                <small>Closing Balance</small>
                <span id="finalBalance" class="final-bal">₹0.00</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-whatsapp" onclick="shareWhatsApp()" title="Share Text"><i class="ri-chat-1-line"></i> <span class="btn-label">Text</span></button>
            <button class="btn-image" onclick="prepareImageShare()" title="Share Image"><i class="ri-image-line"></i> <span class="btn-label">Image</span></button>
            <button class="btn-save" onclick="saveDayEnd()"><i class="ri-save-3-line"></i> <span class="btn-label">Save Day End <small class="shortcut-text">[Alt+S]</small></span></button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/share-image.js"></script>
    <script src="js/dashboard.js"></script>

    <script>
        function prepareImageShare() {
            const data = {
                date: document.getElementById('date').value,
                opening: parseFloat(document.getElementById('opening').value) || 0,
                transactions: transactions,
                totalIn: transactions.filter(t => t.t_type === 'IN').reduce((sum, t) => sum + t.amount, 0),
                totalOut: transactions.filter(t => t.t_type === 'OUT').reduce((sum, t) => sum + t.amount, 0),
                finalBalance: parseFloat(document.getElementById('finalBalance').innerText.replace(/[^0-9.-]+/g,""))
            };
            shareReportAsImage(data);
        }
        function showShortcuts() {
            alert("⌨️ Keyboard Shortcuts:\n\nAlt + I : Cash IN Entry\nAlt + O : Cash OUT Entry\nEnter : Save Entry\nAlt + S : Save Day End\nAlt + H : Go to History");
        }
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
