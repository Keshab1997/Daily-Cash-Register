<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily Hisab Manager Dashboard - Track your daily cash flow, manage transactions, and monitor your financial records in real-time.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co; font-src 'self' https://cdn.jsdelivr.net;">
    <title>Dashboard - Hisab Manager</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" media="all">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="dashboard.html" class="brand">
                <i class="ri-wallet-3-line"></i>
                <h2>Hisab Manager</h2>
            </a>
            <div class="nav-links">
                <button class="btn-icon-nav" onclick="toggleCashCounter()" title="Cash Counter" aria-label="Toggle Cash Counter">
                    <i class="ri-calculator-line" aria-hidden="true"></i>
                </button>
                <a href="dashboard.html" class="active" title="Home" aria-label="Home"><i class="ri-home-4-line" aria-hidden="true"></i></a>
                <a href="box.html" title="Secret Box" aria-label="Secret Box"><i class="ri-archive-drawer-line" aria-hidden="true"></i></a>
                <a href="history.html" title="History" aria-label="History"><i class="ri-file-list-3-line" aria-hidden="true"></i></a>
                <a href="profile.html" title="Profile" aria-label="Profile"><i class="ri-user-3-line" aria-hidden="true"></i></a>
            </div>
        </div>

        <!-- Cash Denomination Counter -->
        <div id="cashCounter" class="cash-counter-box" style="display: none;">
            <div class="counter-header">
                <span><i class="ri-coins-line"></i> Physical Cash Counter</span>
                <div style="display: flex; gap: 10px;">
                    <button onclick="viewCounterHistory()" class="history-mini" title="View History"><i class="ri-history-line"></i></button>
                    <button onclick="toggleCashCounter()" class="close-mini"><i class="ri-close-line"></i></button>
                </div>
            </div>
            
            <!-- Secret Adjustment Info -->
            <div class="adjustment-info">
                <small>Official Bal: <span id="offBal">₹0</span></small>
                <small>Secret Due: <span id="secDue" style="color:#ef4444">₹0</span></small>
                <div class="target-cash">Expected Cash: <b id="targetCash">₹0</b></div>
            </div>

            <div class="counter-grid">
                <!-- High Denominations -->
                <div class="denom-row high-val"><span>50k</span> <input type="number" class="denom-input" data-val="50000" oninput="calcDenom()"></div>
                <div class="denom-row high-val"><span>20k</span> <input type="number" class="denom-input" data-val="20000" oninput="calcDenom()"></div>
                <div class="denom-row high-val"><span>10k</span> <input type="number" class="denom-input" data-val="10000" oninput="calcDenom()"></div>
                
                <!-- Standard Denominations -->
                <div class="denom-row"><span>500</span> <input type="number" class="denom-input" data-val="500" oninput="calcDenom()"></div>
                <div class="denom-row"><span>200</span> <input type="number" class="denom-input" data-val="200" oninput="calcDenom()"></div>
                <div class="denom-row"><span>100</span> <input type="number" class="denom-input" data-val="100" oninput="calcDenom()"></div>
                <div class="denom-row"><span>50</span> <input type="number" class="denom-input" data-val="50" oninput="calcDenom()"></div>
                <div class="denom-row"><span>20</span> <input type="number" class="denom-input" data-val="20" oninput="calcDenom()"></div>
                <div class="denom-row"><span>10</span> <input type="number" class="denom-input" data-val="10" oninput="calcDenom()"></div>
                <div class="denom-row"><span>Coins</span> <input type="number" class="denom-input" data-val="1" oninput="calcDenom()"></div>
            </div>
            <div class="counter-footer">
                <div>Total Counted: <b id="totalCounted">₹0</b></div>
                <div id="diffStatus" class="diff-status">Difference: ₹0</div>
                <button onclick="saveCounterHistory()" class="btn-save-counter" title="Save Count History"><i class="ri-save-line"></i> Save</button>
            </div>
        </div>

        <div class="top-controls">
            <div class="date-group">
                <label class="label-text" for="date">Date (IST)</label>
                <input type="date" id="date" name="date" aria-label="Select date">
            </div>
            <div class="opening-group">
                <label class="label-text" for="opening">Opening Balance</label>
                <input type="number" id="opening" name="opening" value="0" oninput="updateSummary()" aria-label="Opening balance">
            </div>
        </div>

        <div class="entry-grid">
            <div class="card card-in">
                <div class="card-header">
                    <span class="text-green">Cash Received (IN) <small class="shortcut-text">[Alt + I]</small></span>
                    <i class="ri-arrow-down-circle-line text-green"></i>
                </div>
                <div class="input-group">
                    <label for="inName" class="sr-only">Payer Name</label>
                    <input type="text" id="inName" name="inName" placeholder="Payer Name" autocomplete="off" aria-label="Payer name">
                    <label for="inAmount" class="sr-only">Amount</label>
                    <input type="number" id="inAmount" name="inAmount" placeholder="Amount" aria-label="Amount received">
                    <button class="btn-add-in" onclick="addTransaction('IN')" aria-label="Add cash received"><i class="ri-add-line" aria-hidden="true"></i></button>
                </div>
                <ul id="listIn" class="trans-list"></ul>
            </div>

            <div class="card card-out">
                <div class="card-header">
                    <span class="text-red">Cash Payment (OUT) <small class="shortcut-text">[Alt + O]</small></span>
                    <i class="ri-arrow-up-circle-line text-red"></i>
                </div>
                <div class="input-group">
                    <label for="outName" class="sr-only">Receiver / Expense</label>
                    <input type="text" id="outName" name="outName" placeholder="Receiver / Expense" autocomplete="off" aria-label="Receiver or expense name">
                    <label for="outAmount" class="sr-only">Amount</label>
                    <input type="number" id="outAmount" name="outAmount" placeholder="Amount" aria-label="Amount paid">
                    <button class="btn-add-out" onclick="addTransaction('OUT')" aria-label="Add cash payment"><i class="ri-add-line" aria-hidden="true"></i></button>
                </div>
                <ul id="listOut" class="trans-list"></ul>
            </div>
        </div>

        <div class="summary-box">
            <div class="sum-item">
                <small>Total Received</small>
                <span id="sumIn" class="text-green">₹0.00</span>
            </div>
            <div class="sum-item">
                <small>Total Paid</small>
                <span id="sumOut" class="text-red">₹0.00</span>
            </div>
            <div class="sum-item">
                <small>Closing Balance</small>
                <span id="finalBalance" class="final-bal">₹0.00</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-whatsapp" onclick="shareWhatsApp()" title="Share Text" aria-label="Share report via WhatsApp"><i class="ri-chat-1-line" aria-hidden="true"></i> <span class="btn-label">Text</span></button>
            <button class="btn-image" onclick="prepareImageShare()" title="Share Image" aria-label="Share report as image"><i class="ri-image-line" aria-hidden="true"></i> <span class="btn-label">Image</span></button>
            <button class="btn-save" onclick="saveDayEnd()" aria-label="Save day end report"><i class="ri-save-3-line" aria-hidden="true"></i> <span class="btn-label">Save Day End <small class="shortcut-text">[Alt+S]</small></span></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/share-image.js" defer></script>
    <script src="js/dashboard.js" defer></script>
    <script>function prepareImageShare(){const d={date:document.getElementById('date').value,opening:parseFloat(document.getElementById('opening').value)||0,transactions:transactions,totalIn:transactions.filter(t=>t.t_type==='IN').reduce((s,t)=>s+t.amount,0),totalOut:transactions.filter(t=>t.t_type==='OUT').reduce((s,t)=>s+t.amount,0),finalBalance:parseFloat(document.getElementById('finalBalance').innerText.replace(/[^0-9.-]+/g,""))};shareReportAsImage(d);}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
