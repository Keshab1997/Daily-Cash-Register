<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com;">
    <title>Expense Tracker Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/expenses.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <main>
    <div class="container">
        <!-- Navigation Bar -->
        <div class="navbar">
            <a href="dashboard.html" class="brand" aria-label="Expense Tracker">
                <i class="ri-shopping-bag-line"></i>
                <h2>Expense Tracker</h2>
            </a>
            <div class="nav-links">
                <a href="dashboard.html" title="Home" aria-label="Home"><i class="ri-home-4-line" aria-hidden="true"></i></a>
                <a href="expenses.html" class="active" title="Expenses" aria-label="Expenses"><i class="ri-shopping-bag-line" aria-hidden="true"></i></a>
                <a href="box.html" title="Secret Box" aria-label="Secret Box"><i class="ri-archive-drawer-line" aria-hidden="true"></i></a>
                <a href="history.html" title="History" aria-label="History"><i class="ri-file-list-3-line" aria-hidden="true"></i></a>
                <a href="profile.html" title="Profile" aria-label="Profile"><i class="ri-user-3-line" aria-hidden="true"></i></a>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="expense-tabs">
            <button class="tab-btn active" onclick="switchTab('tab-list', event)">
                <i class="ri-list-check"></i> List
            </button>
            <button class="tab-btn" onclick="switchTab('tab-add', event)">
                <i class="ri-add-circle-line"></i> Add
            </button>
            <button class="tab-btn" onclick="switchTab('tab-report', event)">
                <i class="ri-pie-chart-line"></i> Report
            </button>
            <button class="tab-btn tab-btn-pdf" onclick="downloadPDF()" title="Download PDF">
                <i class="ri-file-pdf-line"></i>
            </button>
        </div>

        <!-- Tab 1: List & Summary -->
        <div id="tab-list" class="tab-content active">
            <!-- Summary Cards -->
            <div class="summary-grid-new">
                <div class="stat-box-new">
                    <div class="stat-icon"><i class="ri-wallet-3-line"></i></div>
                    <small>Today's Expense</small>
                    <span id="todayExp">₹0</span>
                </div>
                <div class="stat-box-new" style="--exp-primary: #a855f7;">
                    <div class="stat-icon"><i class="ri-calendar-2-line"></i></div>
                    <small>This Month's Expense</small>
                    <span id="monthExp">₹0</span>
                </div>
            </div>

            <!-- Expense List Section -->
            <div class="section-header">
                <h3>Recent Expenses</h3>
            </div>
            <div id="expenseList" class="exp-list-new"></div>
        </div>

        <!-- Tab 2: Add Expense -->
        <div id="tab-add" class="tab-content">
            <!-- Input Form -->
            <div class="card-expense">
                <h3 style="font-size: 1rem; color: #475569; margin-bottom: 15px;">
                    <i class="ri-add-circle-line"></i> Add New Expense
                </h3>
                <div class="input-grid-4">
                    <input type="hidden" id="editId" value="">
                    <input type="date" id="expDate">
                    <div style="position: relative;">
                        <input type="text" id="expItem" placeholder="What did you buy?" autocomplete="off" oninput="handleItemInput(this.value)">
                        <button type="button" class="field-mic-btn" onclick="startFieldVoice('expItem')" title="Voice input for item">
                            <i class="ri-mic-line"></i>
                        </button>
                        <div id="itemSuggestions" class="suggestions-dropdown"></div>
                    </div>
                    <div style="position: relative;">
                        <input type="text" id="expCat" list="categoryList" placeholder="Auto-detected category" readonly style="background: #f8fafc;">
                        <button type="button" onclick="unlockCategory()" style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6366f1;">
                            <i class="ri-lock-unlock-line" id="catLockIcon"></i>
                        </button>
                        <datalist id="categoryList"></datalist>
                    </div>
                    <div style="position: relative;">
                        <input type="number" id="expAmount" placeholder="Amount" inputmode="numeric">
                        <button type="button" class="field-mic-btn" onclick="startFieldVoice('expAmount')" title="Voice input for amount">
                            <i class="ri-mic-line"></i>
                        </button>
                    </div>
                </div>
                <button class="btn-save-new" onclick="addExpense()">
                    <i class="ri-save-line"></i> Save
                </button>
            </div>

            <!-- Frequently Used Items -->
            <div id="frequentItems" class="frequent-items"></div>

            <!-- Quick Actions Bar -->
            <div class="quick-actions">
                <button class="btn-action btn-category" onclick="openCategoryManager()">
                    <i class="ri-settings-3-line"></i> Categories
                </button>
                <button class="btn-action btn-voice" onclick="startVoiceInput()">
                    <i class="ri-mic-line"></i> Voice
                </button>
                <button class="btn-action btn-lang" id="voiceLangBtn" onclick="toggleVoiceLanguage()" title="Toggle voice language">
                    🇬🇧 EN
                </button>
                <button class="btn-action btn-scan" onclick="openReceiptScanner()">
                    <i class="ri-camera-line"></i> Scan
                </button>
                <button class="btn-action btn-excel" onclick="exportToExcel()">
                    <i class="ri-file-excel-line"></i> Excel
                </button>
                <button class="btn-action btn-whatsapp" onclick="shareViaWhatsApp()">
                    <i class="ri-whatsapp-line"></i> Share
                </button>
            </div>
        </div>

        <!-- Tab 3: Reports -->
        <div id="tab-report" class="tab-content">
            <!-- Pivot Summary (Category Wise) -->
            <div class="pivot-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;"><i class="ri-pie-chart-line"></i> Category-wise Report</h3>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-toggle" onclick="togglePivotView('chart')" id="btnChart">
                            <i class="ri-pie-chart-line"></i> Chart
                        </button>
                        <button class="btn-toggle active" onclick="togglePivotView('table')" id="btnTable">
                            <i class="ri-table-line"></i> Table
                        </button>
                        <button class="btn-pivot-pdf" onclick="downloadPivotPDF()">
                            <i class="ri-file-pdf-line"></i> PDF
                        </button>
                    </div>
                </div>
                
                <!-- Filter Controls -->
                <div class="pivot-filter">
                    <select id="pivotPeriod" onchange="applyPivotFilter()">
                        <option value="all">All Time</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month" selected>This Month</option>
                        <option value="custom">Custom Date</option>
                    </select>
                    <input type="date" id="pivotStartDate" style="display:none;" onchange="applyPivotFilter()">
                    <input type="date" id="pivotEndDate" style="display:none;" onchange="applyPivotFilter()">
                    <input type="number" id="minAmount" placeholder="Min ₹" style="width: 100px;" oninput="applyPivotFilter()">
                    <input type="number" id="maxAmount" placeholder="Max ₹" style="width: 100px;" oninput="applyPivotFilter()">
                    <select id="sortBy" onchange="applyPivotFilter()">
                        <option value="amount-desc">Highest Amount</option>
                        <option value="amount-asc">Lowest Amount</option>
                        <option value="count-desc">Most Items</option>
                        <option value="count-asc">Least Items</option>
                        <option value="name-asc">Name A-Z</option>
                    </select>
                    <button onclick="applyPivotFilter()"><i class="ri-filter-line"></i> Apply</button>
                </div>
                
                <!-- Chart View -->
                <div id="pivotChartView" style="display:none;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                        <div style="background: white; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0;">
                            <h4 style="text-align: center; color: #475569; margin-bottom: 10px;">Pie Chart</h4>
                            <canvas id="pieChart" style="max-height: 300px;"></canvas>
                        </div>
                        <div style="background: white; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0;">
                            <h4 style="text-align: center; color: #475569; margin-bottom: 10px;">Bar Chart</h4>
                            <canvas id="barChart" style="max-height: 300px;"></canvas>
                        </div>
                    </div>
                    <div style="background: white; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; margin-top: 20px;">
                        <h4 style="text-align: center; color: #475569; margin-bottom: 10px;">Trend Analysis</h4>
                        <canvas id="lineChart" style="max-height: 250px;"></canvas>
                    </div>
                </div>
                
                <!-- Table View -->
                <div id="pivotTableView">
                    <div class="pivot-table-wrapper">
                        <table class="pivot-table">
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th style="text-align: center;">Count</th>
                                    <th style="text-align: right;">Total Amount</th>
                                    <th style="text-align: right;">Avg Amount</th>
                                    <th style="text-align: center;">% of Total</th>
                                </tr>
                            </thead>
                            <tbody id="pivotBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>

    <!-- Floating Action Button -->
    <button class="fab" onclick="(function(){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.getElementById('tab-add').classList.add('active');document.querySelectorAll('.tab-btn')[1].classList.add('active');})()" title="Add Expense">
        <i class="ri-add-line"></i>
    </button>

    <!-- Category Manager Modal -->
    <div id="categoryModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="ri-settings-3-line"></i> Manage Categories</h3>
                <span class="modal-close" onclick="closeCategoryManager()">&times;</span>
            </div>
            <div class="modal-body">
                <!-- Add New Category Form -->
                <div class="add-category-form">
                    <h4 style="margin-bottom: 10px; color: #475569;">Add New Category</h4>
                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <button type="button" id="newCatIcon" class="icon-selector" onclick="selectIconForNew()">📌</button>
                        <input type="text" id="newCatName" placeholder="Category name" style="flex: 1; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px;">
                        <button class="btn-add-cat" onclick="addNewCategoryFromManager()">
                            <i class="ri-add-line"></i> Add
                        </button>
                    </div>
                </div>
                
                <!-- Category List -->
                <h4 style="margin-bottom: 10px; color: #475569;">Your Categories</h4>
                <div class="category-list" id="categoryManagerList"></div>
            </div>
        </div>
    </div>

    <!-- Icon Picker Modal -->
    <div id="iconPickerModal" class="modal" style="display:none;">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>Select Icon</h3>
                <span class="modal-close" onclick="closeIconPicker()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="icon-grid" id="iconGrid"></div>
            </div>
        </div>
    </div>

    <!-- Receipt Scanner Modal -->
    <div id="scannerModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="ri-camera-line"></i> Scan Receipt</h3>
                <span class="modal-close" onclick="closeScannerModal()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="file" id="receiptImage" accept="image/*" capture="environment" onchange="processReceipt(this)">
                <div id="scannerPreview"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/config.js" defer></script>
    <script src="js/expenses.js" defer></script>
    <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
