<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com;">
<title>Secret History - Hisab</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/secret_history.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" media="all">
</head>
<body>
<main>
<div class="container">
<div class="navbar">
<a href="box.html" class="brand">
<i class="ri-history-line"></i>
<h2>Secret History</h2>
</a>
<div class="nav-links">
<a href="dashboard.html" title="Home" aria-label="Home"><i class="ri-home-4-line" aria-hidden="true"></i></a>
<a href="box.html" class="active" title="Secret Box" aria-label="Secret Box"><i class="ri-archive-drawer-line" aria-hidden="true"></i></a>
<a href="history.html" title="History" aria-label="History"><i class="ri-file-list-3-line" aria-hidden="true"></i></a>
<a href="profile.html" title="Profile" aria-label="Profile"><i class="ri-user-3-line" aria-hidden="true"></i></a>
</div>
</div>

<div class="filter-bar">
    <div class="date-range">
        <input type="date" id="startDate" onchange="fetchHistory()">
        <span class="to-text">to</span>
        <input type="date" id="endDate" onchange="fetchHistory()">
    </div>
    <input type="text" id="filterName" placeholder="Filter by Name..." oninput="applyFilters()">
    <input type="text" id="filterPurpose" placeholder="Filter by Purpose..." oninput="applyFilters()">
</div>

<div class="action-bar">
    <div class="view-toggle">
        <button class="btn-toggle" id="btnDetailed" onclick="switchView('detailed')" aria-label="Detailed view">
            <i class="ri-list-check" aria-hidden="true"></i> Detailed
        </button>
        <button class="btn-toggle active" id="btnSummary" onclick="switchView('summary')" aria-label="Net balance view">
            <i class="ri-user-line" aria-hidden="true"></i> Net Balance
        </button>
    </div>
    <button class="btn-pdf" onclick="downloadSecretPDF()" aria-label="Download PDF">
        <i class="ri-file-pdf-line" aria-hidden="true"></i> PDF
    </button>
</div>

<div class="table-responsive">
    <table class="secret-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Name</th>
                <th>Purpose</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Quick Return / Action</th>
            </tr>
        </thead>
        <tbody id="historyBody">
        </tbody>
    </table>
</div>
<div id="loading" class="loading-msg">Loading data...</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/secret_history.js" defer></script>
</body>
</html>
