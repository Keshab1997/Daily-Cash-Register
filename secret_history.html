<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret History - Hisab</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/18062/18062856.png">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/secret_history.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
<div class="container">
<div class="navbar">
<a href="box.html" class="brand">
<i class="ri-history-line"></i>
<h2>Secret History</h2>
</a>
<div class="nav-links">
<a href="dashboard.html" title="Home"><i class="ri-home-4-line"></i></a>
<a href="box.html" class="active" title="Secret Box"><i class="ri-archive-drawer-line"></i></a>
<a href="history.html" title="History"><i class="ri-file-list-3-line"></i></a>
</div>
</div>

<div class="filter-bar">
        <input type="date" id="filterDate" onchange="applyFilters()">
        <input type="text" id="filterName" placeholder="Filter by Name..." oninput="applyFilters()">
        <input type="text" id="filterPurpose" placeholder="Filter by Purpose..." oninput="applyFilters()">
    </div>

    <div class="table-responsive">
        <table class="secret-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Purpose</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Quick Return / Action</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- Data will load here -->
            </tbody>
        </table>
    </div>
    <div id="loading" class="loading-msg">Loading data...</div>
</div>

<script src="js/config.js"></script>
<script src="js/secret_history.js"></script>
</body>
</html>
